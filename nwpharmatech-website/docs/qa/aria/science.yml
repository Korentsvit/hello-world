  - region "Why investigate CBD in this setting?":
    - paragraph: Question 1
    - heading "Why investigate CBD in this setting?" [level=2]
    - text: Established
    - paragraph: Biological rationale
    - paragraph:
      - text: Cannabidiol (CBD) and THC both come from the cannabis plant but act differently. CBD does not produce a "high". Daily use of high-THC cannabis is associated with higher odds of psychotic disorder.
      - 'link "Source: Di Forti et al. 2019"':
        - /url: /evidence#ref-diforti-2019
    - paragraph:
      - text: No medicine is licensed for people at clinical high risk of psychosis, and NICE advises against antipsychotics for prevention.
      - 'link "Source: NICE CG178"':
        - /url: /evidence#ref-nice-cg178
    - text: Emerging evidence
    - paragraph: Findings from other CBD preparations
    - paragraph:
      - text: In small experiments, CBD and THC had opposite effects on some measures of brain activity.
      - 'link "Source: Bhattacharyya et al. 2010"':
        - /url: /evidence#ref-bhattacharyya-2010
      - text: In people at clinical high risk, a single CBD dose partly shifted brain activity towards that of healthy volunteers during a memory task,
      - 'link "Source: Bhattacharyya et al. 2018"':
        - /url: /evidence#ref-bhattacharyya-2018
      - text: and a small three-week study reported lower symptom scores than placebo.
      - 'link "Source: Bhattacharyya et al. 2024"':
        - /url: /evidence#ref-bhattacharyya-2024
    - paragraph:
      - text: "In schizophrenia, results are mixed: two small trials were favourable"
      - 'link "Source: McGuire et al. 2018"':
        - /url: /evidence#ref-mcguire-2018
      - 'link "Source: Leweke et al. 2012"':
        - /url: /evidence#ref-leweke-2012
      - text: and one found no benefit.
      - 'link "Source: Boggs et al. 2018"':
        - /url: /evidence#ref-boggs-2018
    - text: Programme information
    - paragraph: About NWPT-SM32300
    - paragraph: No study of NWPT-SM32300 has yet been done in people at clinical high risk. None of the findings above used NWPT-SM32300.
    - text: Open question
    - paragraph: Unanswered
    - paragraph:
      - text: Whether CBD reduces symptoms, improves functioning or lowers the risk of psychosis in this group. A larger UK trial that could have answered this did not go ahead.
      - 'link "Source: CANTOP-RCT report"':
        - /url: /evidence#ref-cantop
    - paragraph:
      - link "Full study cards in the evidence library":
        - /url: /evidence
  - region "Why investigate a micellar softgel?":
    - paragraph: Question 2
    - heading "Why investigate a micellar softgel?" [level=2]
    - text: Established
    - paragraph: The delivery problem
    - paragraph:
      - text: CBD dissolves poorly in water. Taken by mouth on an empty stomach, only about 6% of a dose is estimated to reach the bloodstream, and much is broken down by the liver first. A high-fat meal increases absorption several-fold, which makes exposure depend on what someone has eaten.
      - 'link "Source: Perucca and Bialer 2020"':
        - /url: /evidence#ref-perucca-2020
      - 'link "Source: Taylor et al. 2018"':
        - /url: /evidence#ref-taylor-2018
    - text: Programme information
    - paragraph: The design of NWPT-SM32300
    - paragraph: "NWPT-SM32300 is a 300 mg oral softgel capsule. Its contents are a self-emulsifying (micellar) lipid formulation: when the capsule opens in the gut, the contents are designed to disperse into very small droplets, a way of carrying poorly water-soluble medicines. A fixed-strength capsule also avoids measuring doses from an oil."
    - text: Open question
    - paragraph: Not yet shown
    - paragraph:
      - text: Whether this formulation gives more consistent absorption than other CBD products, and how food affects it, has not been published. The
      - link "Phase 1 study":
        - /url: /phase-1
      - text: measured absorption; its results are not yet published. No study has measured how much reaches the brain.
    - figure "What the formulation is designed to do, and where the evidence currently stops. Schematic, not to scale; it does not show a proven mechanism or any clinical benefit.":
      - 'img "From capsule to measurement Five steps. 1: a 300 mg softgel containing cannabidiol in a lipid fill. 2: in the gut the capsule opens and the fill disperses into very small droplets. 3: cannabidiol is absorbed through the gut wall, and much is broken down by the liver. 4: cannabidiol and its breakdown products in the blood, which is what the Phase 1 study measured. 5, shown dashed: the brain, which was not measured; delivery to the brain has not been shown."': "1 Softgel 300 mg CBD in a lipid fill 2 In the gut Fill disperses into tiny droplets 3 Absorption Through the gut wall; much is broken down by the liver 4 In the blood CBD and breakdown products Measured in Phase 1 5 The brain: not measured Delivery to the brain has not been shown"
      - text: What the formulation is designed to do, and where the evidence currently stops. Schematic, not to scale; it does not show a proven mechanism or any clinical benefit.
  - region "Why study a dose range?":
    - paragraph: Question 3
    - heading "Why study a dose range?" [level=2]
    - text: Established
    - paragraph: General principle
    - paragraph:
      - text: Benefits and side effects of a medicine can both depend on dose. With CBD, rises in liver enzymes are dose-related.
      - 'link "Source: Epidyolex SmPC"':
        - /url: /evidence#ref-epidyolex-smpc
      - text: A Phase 2B study compares doses so that any later study can use the dose with the best balance of benefit and tolerability, or stop if none is adequate.
    - text: Emerging evidence
    - paragraph: Doses used with other CBD preparations
    - paragraph:
      - text: Studies in people at clinical high risk used 600 mg a day.
      - 'link "Source: Bhattacharyya et al. 2024"':
        - /url: /evidence#ref-bhattacharyya-2024
      - text: Trials in schizophrenia used between 600 and 1,000 mg a day, with mixed results.
      - 'link "Source: Boggs et al. 2018"':
        - /url: /evidence#ref-boggs-2018
      - 'link "Source: McGuire et al. 2018"':
        - /url: /evidence#ref-mcguire-2018
      - text: Doses cannot be transferred directly between products that are absorbed differently.
    - text: Programme information
    - paragraph: NWPT-SM32300
    - paragraph: Each capsule contains 300 mg, so doses are whole numbers of capsules. The Phase 1 study gave single doses of 600 mg and 900 mg to healthy volunteers. The doses for the Phase 2B study have not been confirmed.
    - text: Open question
    - paragraph: Unanswered
    - paragraph: Which dose, if any, helps people at clinical high risk, and which is best tolerated with daily use.
