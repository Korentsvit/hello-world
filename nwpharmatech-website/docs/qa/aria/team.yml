- main:
  - paragraph: People and governance
  - heading "The people behind the programme" [level=1]
  - paragraph: Expertise in clinical high risk of psychosis, clinical trial design and cannabinoid science, alongside the company's management, board members and senior advisers.
  - figure "Independent research areas shown as a conceptual network.":
    - img "Three abstract research networks connected through a shared scientific center."
    - text: Independent research areas shown as a conceptual network.
  - region "Clinical and scientific leadership":
    - heading "Clinical and scientific leadership" [level=2]
    - article:
      - paragraph: Clinical high risk of psychosis (CHR-P)
      - heading "Dr Scott W. Woods" [level=3]
      - paragraph: CHR-P programme lead
      - paragraph: Individual capacity
      - paragraph: Psychiatrist and researcher who has worked for many years on identifying and helping young people at clinical high risk of psychosis.
      - paragraph: "Dr Woods contributes in an individual capacity. His Yale affiliation is given for identification only; Yale University does not endorse or sponsor the programme. Programme leadership is separate from the study sponsor role: NWPharmaTech is developing the proposed CHR-P programme, and formal study responsibilities will be documented before the study begins."
      - heading "Responsibilities" [level=4]
      - list:
        - listitem: Leads the CHR-P programme.
      - heading "Affiliations" [level=4]
      - list:
        - listitem: Professor of Psychiatry, Yale School of Medicine
        - listitem: Director, PRIME Clinic, which specialises in people at clinical high risk of psychosis
    - article:
      - paragraph: Clinical trial design
      - heading "Dr John M. Kane" [level=3]
      - paragraph: Lead, Schizophrenia Programme
      - paragraph: Psychiatrist and schizophrenia researcher with long experience of leading clinical trials.
      - paragraph: The schizophrenia programme is separate from the CHR-P programme.
      - heading "Affiliations" [level=4]
      - list:
        - listitem: Professor of Psychiatry and Molecular Medicine, Donald and Barbara Zucker School of Medicine at Hofstra/Northwell
        - listitem: Co-director, Institute for Behavioral Science, Feinstein Institutes for Medical Research
    - article:
      - paragraph: Cannabinoid neuropharmacology
      - heading "Dr Grace Blest-Hopley" [level=3]
      - paragraph: Partner & Chief Scientific Officer
      - paragraph: Neuroscientist specialising in cannabinoid neuropharmacology. PhD from King's College London on the actions and effects of cannabinoids.
      - paragraph: Leads the company's scientific work. She is not the CHR-P programme lead.
    - paragraph: Naming a university, hospital or company on this page does not mean that it endorses the programme.
  - region "Management":
    - heading "Management" [level=2]
    - article:
      - paragraph: Company strategy
      - heading "Filipp Korentsvit" [level=3]
      - paragraph: Chief Executive Officer
      - paragraph: Previously an Executive Director at Goldman Sachs. BSc in Economics and Statistics, University College London.
      - heading "Responsibilities" [level=4]
      - list:
        - listitem: Leads company strategy.
    - article:
      - paragraph: Co-founder
      - heading "Daud Gutseriev" [level=3]
      - paragraph: Previously an Associate Director at VTB Capital in infrastructure and project financing. Executive MBA, University of Oxford Saïd Business School.
  - region "Board and senior advisers":
    - heading "Board and senior advisers" [level=2]
    - article:
      - paragraph: Pharmaceutical business and finance
      - heading "William Jarosz" [level=3]
      - paragraph: Business leader with a background in finance and the pharmaceutical industry. JD, Harvard Law School; MA in Law and Diplomacy, Tufts University.
    - article:
      - paragraph: Life-sciences leadership
      - heading "Professor Richard Barker OBE" [level=3]
      - paragraph: Director General of the Association of the British Pharmaceutical Industry (ABPI) from 2004 to 2011, former Chief Executive of Chiron, and former non-executive director of Celgene.
    - article:
      - paragraph: Pharmaceutical commercial strategy
      - heading "Dr Gillian Cannon" [level=3]
      - paragraph: Board Member
      - paragraph: Pharmaceutical executive with senior roles at Merck and Otsuka.
    - article:
      - paragraph: Regulatory and clinical development
      - heading "Professor Trevor Jones CBE" [level=3]
      - paragraph: Senior Adviser
      - paragraph: Former research and development director at the Wellcome Foundation and former chair of the European Medicinal Cannabis Association.
      - heading "Affiliations" [level=4]
      - list:
        - listitem: Visiting Professor, King's College London
  - region "How clinical decisions stay independent":
    - heading "How clinical decisions stay independent" [level=2]
    - list:
      - listitem: Clinical decisions, including study design, eligibility, safety and conduct, are kept independent of funding and financing.
      - listitem: Each study needs approval from the medicines regulator and a research ethics committee before it can start.
