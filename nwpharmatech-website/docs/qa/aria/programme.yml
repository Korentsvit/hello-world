- main:
  - paragraph: The programme
  - heading "Programme overview" [level=1]
  - paragraph: NWPT-SM32300 is an investigational oral cannabidiol medicine. A Phase 1 study in healthy volunteers is complete. A Phase 2B study in people at clinical high risk of psychosis is planned.
  - heading "About NWPT-SM32300" [level=2]
  - text: Programme information
  - term: Form
  - definition: 300 mg oral softgel capsule
  - term: Active ingredient
  - definition: highly purified cannabidiol
  - term: Formulation
  - definition: self-emulsifying (micellar) lipid formulation, developed with the University of Toronto
  - term: Manufacture
  - definition: Good Manufacturing Practice (GMP) standard, by Thermo Fisher Scientific
  - term: THC
  - definition: THC is not detected at the sensitivity of the validated test method
  - term: Capsule shell
  - definition: Contains gelatine of bovine origin
  - term: Status
  - definition: Investigational; not approved by any medicines regulator; available only within authorised clinical research
  - paragraph:
    - link "Why a micellar softgel, and why study a range of doses":
      - /url: /science
  - complementary:
    - heading "What \"Phase 2B\" means" [level=3]
    - paragraph: Medicines are tested in stages. Phase 1 studies look mainly at safety and how the body handles a medicine, usually in healthy volunteers. Phase 2 studies look at whether it may work in people with the condition, and at what dose.
    - paragraph: A Phase 2B study typically compares more than one dose with a control, to understand the dose–response relationship and decide whether a larger Phase 3 study is justified.
  - region "Where the programme stands":
    - heading "Where the programme stands" [level=2]
    - link "Completed Phase 1 study 14 healthy adult volunteers aged 18 to 55; single doses of 600 mg and 900 mg compared with Epidyolex. Completed 10 December 2025. Results not yet published. Phase 1 study":
      - /url: /phase-1
      - paragraph: Completed
      - heading "Phase 1 study" [level=3]
      - paragraph: 14 healthy adult volunteers aged 18 to 55; single doses of 600 mg and 900 mg compared with Epidyolex. Completed 10 December 2025. Results not yet published.
      - text: Phase 1 study
    - 'link "Planned Phase 2B study In people at clinical high risk of psychosis, to evaluate dose response, symptoms, safety and tolerability. Protocol being finalised. Not recruiting. The study: progress and evidence"':
      - /url: /study
      - paragraph: Planned
      - heading "Phase 2B study" [level=3]
      - paragraph: In people at clinical high risk of psychosis, to evaluate dose response, symptoms, safety and tolerability. Protocol being finalised. Not recruiting.
      - text: "The study: progress and evidence"
    - link "Record Programme updates Dated events, each supported by a programme record. Programme updates":
      - /url: /updates
      - paragraph: Record
      - heading "Programme updates" [level=3]
      - paragraph: Dated events, each supported by a programme record.
      - text: Programme updates
  - heading "Protecting participants" [level=2]
  - paragraph:
    - text: The Phase 2B study can start only after approval by a research ethics committee and the relevant medicines regulators. Anyone taking part would give informed consent and could leave at any time. Cannabidiol can raise liver enzymes and interact with other medicines,
    - 'link "Source: Epidyolex SmPC"':
      - /url: /evidence#ref-epidyolex-smpc
    - text: so safety monitoring will be set out in the study protocol.
  - complementary:
    - heading "Can I take part?" [level=3]
    - paragraph:
      - text: "Not yet: the Phase 2B study is"
      - strong: not recruiting
      - text: ", and we cannot supply NWPT-SM32300 outside an approved study."
