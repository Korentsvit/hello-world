        - term: Design
        - definition: Review
        - term: Finding
        - definition: Taken by mouth while fasting, only about 6% of a CBD dose is estimated to reach the bloodstream; a high-fat meal increases this about fourfold. Much of each dose is broken down by the liver before reaching the circulation.
