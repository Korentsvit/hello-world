- main:
  - paragraph: The research
  - heading "Evidence library" [level=1]
  - paragraph: "The studies and guidelines behind this website, each summarised the same way: who was studied, which product, how, what was found, and the limitations."
  - region "In plain language":
    - heading "In plain language" [level=2]
    - paragraph:
      - text: "Clinical high risk of psychosis is well described: most people who meet the criteria do not develop psychosis, and about one in four do within three years."
      - 'link "Source: Source: Salazar de Pablo et al. 2021"':
        - /url: evidence.html#ref-salazar-2021
      - text: Psychological therapy is the recommended first step, but no treatment has been proven to prevent psychosis.
      - 'link "Source: Source: Davies et al. 2018"':
        - /url: evidence.html#ref-davies-2018
    - paragraph: "Research on cannabidiol (CBD) in psychosis is early: small, short studies of other CBD products, with mixed results. None of them used NWPT-SM32300. Evidence about NWPT-SM32300 itself so far comes only from a Phase 1 study in healthy volunteers, whose results are not yet published."
    - paragraph:
      - text: Evidence labels (Established, Emerging evidence) describe the strength of evidence.
      - strong: Programme information
      - text: marks records about our own studies; it is not an assessment of evidence strength. Negative, mixed and inconclusive findings are flagged on each card.
