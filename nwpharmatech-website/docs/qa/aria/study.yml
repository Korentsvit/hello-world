  - region "Registrations":
    - heading "Registrations" [level=2]
    - paragraph: "The completed Phase 1 study is registered on two public registries. Both entries describe the same study: a single-dose, three-period crossover study of NW300EMCBD (the development code for NWPT-SM32300) in healthy adults aged 18 to 55, sponsored by NWPharmaTech Ltd."
    - table "Registry entries":
      - caption: Registry entries
      - rowgroup:
        - row "Study Registry Identifier":
          - columnheader "Study"
          - columnheader "Registry"
          - columnheader "Identifier"
      - rowgroup:
        - 'row "Phase 1 Registry: ClinicalTrials.gov Identifier: NCT07186283"':
          - rowheader "Phase 1"
          - 'cell "Registry: ClinicalTrials.gov"'
          - 'cell "Identifier: NCT07186283"':
            - text: "Identifier:"
            - link "NCT07186283":
              - /url: https://clinicaltrials.gov/study/NCT07186283
        - 'row "Phase 1 Registry: ISRCTN Identifier: ISRCTN25163383"':
          - rowheader "Phase 1"
          - 'cell "Registry: ISRCTN"'
          - 'cell "Identifier: ISRCTN25163383"':
            - text: "Identifier:"
            - link "ISRCTN25163383":
              - /url: https://www.isrctn.com/ISRCTN25163383
    - heading "Sponsor and oversight" [level=2]
    - paragraph: In clinical trial law, the sponsor is the organisation that takes responsibility for starting, managing and financing a study. NWPharmaTech Ltd was the sponsor of the Phase 1 study.
    - heading "Phase 1 study (completed)" [level=3]
    - list:
      - listitem: "Sponsor: NWPharmaTech Ltd."
      - listitem: Pre-specified stopping rules, including stopping if one participant had a serious reaction possibly related to the study medicine, or two had severe reactions.
      - listitem: No data monitoring committee was used.
      - listitem: Statistical outputs were produced by an external biostatistics provider under documented quality testing.
    - heading "Phase 2B study (planned)" [level=3]
    - paragraph: NWPharmaTech is developing the proposed CHR-P programme. Formal study responsibilities will be documented before the study begins.
