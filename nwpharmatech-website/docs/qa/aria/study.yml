- main:
  - paragraph: The programme
  - 'heading "The study: progress and evidence" [level=1]'
  - paragraph: Where the NWPT-SM32300 study programme stands, what has been completed, and the sources behind each statement.
  - region "Summary":
    - heading "Summary" [level=2]
    - paragraph:
      - text: As of
      - time: 23 September 2026
    - term: What the study is intended to investigate
    - definition: Whether NWPT-SM32300, an investigational oral cannabidiol medicine, shows a dose response, changes symptoms, and is safe and tolerable in people at clinical high risk of psychosis.
    - term: Current stage
    - definition: Phase 2B study planned. Protocol being finalised. Not recruiting.
    - term: Completed so far
    - definition: "Phase 1 study in 14 healthy volunteers: completed 10 December 2025; database locked 11 March 2026; analysis outputs delivered 30 March 2026."
    - term: Next milestone
    - definition: Finalise the Phase 2B protocol, then submit it for regulatory and research ethics review. No date has been set.
  - region "Public synopsis":
    - heading "Public synopsis" [level=2]
    - text: Programme information
    - paragraph: The planned Phase 2B study will evaluate dose response, symptoms, safety and tolerability of NWPT-SM32300 in people at clinical high risk of psychosis. It follows a completed Phase 1 study in healthy volunteers, which looked at how the body absorbs and handles the medicine and at short-term tolerability.
    - paragraph: The Phase 2B study is not recruiting. It will start only after regulatory and research ethics approval, and will be registered publicly before anyone is enrolled.
    - heading "Proposed design" [level=3]
    - 'heading "Programme brief: Phase 2B aims" [level=3]'
    - paragraph: "Source and version: Website brief, September 2026"
    - list:
      - listitem: "Population: people at clinical high risk of psychosis."
      - listitem: "Aims: dose response, symptoms, safety and tolerability."
    - paragraph: Further design details will be published here when the protocol is final and approved.
    - complementary:
      - heading "Programme brief" [level=3]
      - paragraph: A two-page summary of the programme, generated from the same facts as this page.
      - paragraph:
