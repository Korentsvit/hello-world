  - region "Publication policy":
    - heading "Publication policy" [level=2]
    - text: Draft for management adoption
    - paragraph: This is a proposed policy. It has not been adopted, and no timetable in it is yet a commitment.
    - list:
      - listitem:
        - strong: Disclosure regardless of outcome.
        - text: Results of every study of NWPT-SM32300 would be made public whether they are positive, negative or inconclusive, including studies stopped early.
      - listitem:
        - strong: Registry results.
        - text: Summary results would be posted on each registry where the study is registered, within the period the registry or applicable law requires.
      - listitem:
        - strong: Plain-language summary.
        - text: A plain-language summary would be published on this site and offered to participants, reviewed for accuracy and readability before release.
      - listitem:
        - strong: Journal submission.
        - text: Full results of each Phase 2 or later study would be submitted to a peer-reviewed journal, with authorship decided by recognised authorship criteria and no funder or investor right to delay or alter the manuscript.
      - listitem:
        - strong: Timing.
        - text: The proposed timings for each step are to be set by management when the policy is adopted.
