- main:
  - text: Legal
  - heading "Legal, privacy and accessibility" [level=1]
  - paragraph: "This website is published by NWPharmaTech Ltd, registered in England and Wales, company number 13572461. Registered office: Kemp House, 160 City Road, London EC1V 2NX."
  - heading "Important information" [level=2]
  - list:
    - listitem:
      - strong: Investigational medicine.
      - text: NWPT-SM32300 is an investigational medicine. It is not approved by any medicines regulator for any use, and its safety and effectiveness have not been established. Nothing on this website is intended to promote it or any other medicine.
    - listitem:
      - strong: Not medical advice.
      - text: This website gives general information and is not a substitute for advice from a qualified health professional.
    - listitem:
      - strong: Not an offer.
      - text: Nothing on this website is an offer to sell, or a solicitation of an offer to buy, any security, token, digital asset or other financial product, or an invitation or inducement to engage in investment activity, in any jurisdiction. No investment is being accepted.
    - listitem:
      - strong: Forward-looking statements.
      - text: Statements about plans, study design and timelines reflect current intentions, depend on regulatory and ethics approval and other factors, and may change.
    - listitem:
      - strong: Accuracy.
      - text: We aim to keep content accurate and current and to label the strength of evidence. Please consult the cited sources.
  - heading "Privacy notice" [level=2]
  - paragraph: "NWPharmaTech Ltd is the data controller for personal information you send us, for example by email or post. We use it only to respond to you, keep it no longer than necessary, and do not sell it. You have rights under UK and EU data protection law, including to access or delete your information and to complain to the Information Commissioner's Office (ico.org.uk). [TBC: legal review of the full privacy notice, retention period and data protection contact]"
  - heading "Cookies" [level=2]
  - paragraph: This website does not set cookies, use analytics, or load third-party fonts or scripts. If this changes, this section will be updated and your consent will be requested first where the law requires.
  - heading "Accessibility" [level=2]
  - paragraph: We aim to meet the Web Content Accessibility Guidelines (WCAG) 2.2 at level AA. The site supports keyboard navigation, visible focus, screen readers, text resizing to 200% and use without JavaScript. Automated checks (axe-core) report no violations on any page; a full manual audit, including with assistive technology users, has not yet been carried out.
  - paragraph:
    - text: If you find anything difficult to use, please
    - link "contact us":
      - /url: contact.html
    - text: .
