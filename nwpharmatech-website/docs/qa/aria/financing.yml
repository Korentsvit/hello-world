- main:
  - paragraph: About
  - heading "Funding and financing" [level=1]
  - paragraph: How the programme is paid for, who decides how money is spent, and how we report progress. Nothing on this page is an offer, and no investment is being accepted.
  - region "What funding supports":
    - heading "What funding supports" [level=2]
    - list:
      - listitem: Running clinical studies, including the planned Phase 2B study
      - listitem: Manufacturing clinical supplies of NWPT-SM32300 to GMP standard
      - listitem: Regulatory, safety and quality work
      - listitem: Programme operations, data management and analysis
    - heading "What is and is not funded" [level=2]
    - table "Funding milestones":
      - caption: Funding milestones
      - rowgroup:
        - row "Milestone Status Date Source":
          - columnheader "Milestone"
          - columnheader "Status"
          - columnheader "Date"
          - columnheader "Source"
      - rowgroup:
        - 'row "Financing for the Phase 2B study Status: In progress Date: As at August 2026 Source: Company records"':
          - rowheader "Financing for the Phase 2B study"
          - 'cell "Status: In progress"'
          - 'cell "Date: As at August 2026"'
          - 'cell "Source: Company records"'
        - 'row "Programme financing route for eligible investors Status: In progress Date: In development; not available Source: Company records"':
          - rowheader "Programme financing route for eligible investors"
          - 'cell "Status: In progress"'
          - 'cell "Date: In development; not available"'
          - 'cell "Source: Company records"'
    - paragraph: "Figures are published only once they are approved and can be shown as one of: planning target, committed funding, cash received, or money spent. Expressions of interest are never counted as funding."
  - region "Who controls spending and clinical decisions":
    - heading "Who controls spending and clinical decisions" [level=2]
    - paragraph:
      - strong: Spending
      - text: is controlled by the board of NWPharmaTech Ltd, the programme's company.
    - paragraph:
      - strong: Clinical decisions
      - text: (study design, eligibility, dosing, safety, analysis and publication) are made by the clinical and scientific leadership and approved by regulators and research ethics committees. Funders and investors have no say in them and no access to participant data.
    - heading "How progress is reported" [level=2]
    - paragraph:
      - text: Dated events appear on the
      - link "updates page":
        - /url: updates.html
      - text: ", and study milestones with their sources on the"
      - link "study page":
        - /url: study.html#milestones
      - text: . Programme reports, answering what changed, what supports it, what remains unresolved and what happens next, are planned; see the
      - link "newsroom":
        - /url: newsroom.html
      - text: .
    - paragraph: Reports are written for the public and are not investment communications.
  - region "The financing route in development":
    - heading "The financing route in development" [level=2]
    - text: Programme information
    - paragraph:
      - strong: "Preferred: platform-integrated programme financing."
      - text: Eligible investors would take part in a dedicated programme vehicle through a regulated investor platform, which would carry out eligibility, identity and anti-money-laundering checks. Where feasible, investors' interests would be issued as permissioned tokens at closing.
    - paragraph:
      - strong: "Fallback: register-first."
      - text: Interests would be recorded on a conventional register of holders, with any digital representation added only if and when lawful and approved.
    - paragraph: Eligibility would be set by the law of each country, is likely to be limited to professional, qualified or accredited investors, and would exclude some countries.
    - paragraph: "[TBC: board and legal approval of the funding and financing wording on this page before publication]"
    - complementary:
      - heading "Current status" [level=3]
      - paragraph: Not available
      - paragraph: No tokens have been issued, no investment is being accepted, and no investment, payment or token function on this website is active.
      - paragraph:
        - strong: "Risk, in brief:"
        - text: NWPT-SM32300 may not work; most investigational medicines are never approved; any money invested could be lost; interests may be impossible to sell.
      - paragraph:
        - strong: Beware of scams.
        - text: Any token, coin or "presale" claiming a link to us is not ours. We never make unsolicited investment approaches; please
        - link "report":
          - /url: contact.html
        - text: any you receive.
