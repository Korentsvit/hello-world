- main:
  - text: The clinical need
  - heading "People at clinical high risk of psychosis" [level=1]
  - paragraph: Some young people seek help for distressing experiences that resemble mild or brief symptoms of psychosis. Specialist services can identify them as being at clinical high risk. Many are struggling now, some go on to develop a psychotic disorder, and no medicine is licensed to help them.
  - heading "What \"clinical high risk\" means" [level=2]
  - text: Established
  - paragraph: "Clinical high risk of psychosis (CHR-P; also called an \"at-risk mental state\") describes people, usually adolescents and young adults, who have sought help and meet defined criteria on a structured assessment such as the CAARMS or the SIPS. The criteria cover three groups:"
  - list:
    - listitem:
      - strong: "Attenuated psychotic symptoms:"
      - text: unusual thoughts, perceptions or suspiciousness that are milder or briefer than in psychosis.
    - listitem:
      - strong: "Brief limited intermittent psychotic symptoms:"
      - text: short episodes of psychotic symptoms that resolve on their own.
    - listitem:
      - strong: "Genetic risk with functional decline:"
      - text: a close relative with a psychotic disorder, plus a recent fall in day-to-day functioning.
  - paragraph: "Most people who meet these criteria do not go on to develop psychosis. Kaplan–Meier cumulative estimates from an updated meta-analysis suggest that about one in four may do so within about three years, with wide variation between studies. Those who do not develop psychosis are a mixed group: some recover, while others continue to have milder symptoms and difficulties with day-to-day life."
  - paragraph:
    - 'link "Source: Fusar-Poli et al. 2013"':
      - /url: /evidence#ref-fusarpoli-2013
    - 'link "Source: Salazar de Pablo et al. 2021"':
      - /url: /evidence#ref-salazar-2021
    - 'link "Source: Addington et al. 2011"':
      - /url: /evidence#ref-addington-2011
  - complementary:
    - heading "A note on language" [level=3]
    - paragraph: Being at clinical high risk is not a diagnosis of psychosis, and it does not mean psychosis is inevitable.
    - paragraph: We use the term because it is standard in research and specialist services, and because it identifies people who deserve good care now.
  - heading "Care available today" [level=2]
  - text: Established
  - paragraph: Summary of guidance from the National Institute for Health and Care Excellence (NICE) in England. Guidance differs between countries.
  - heading "Psychological therapy" [level=3]
  - paragraph: For adults considered at increased risk of psychosis, NICE recommends offering individual cognitive behavioural therapy (CBT), with or without family intervention. For children and young people, it recommends considering the same.
  - heading "Monitoring and support" [level=3]
  - paragraph: Specialist early intervention services offer assessment, regular monitoring, and treatment for problems such as anxiety, depression and substance use.
  - heading "No licensed medicine" [level=3]
  - paragraph: No medicine is licensed for this group. NICE advises against offering antipsychotic medication to people considered at increased risk, or with the aim of reducing the risk of or preventing psychosis.
  - paragraph:
    - 'link "Source: NICE CG178"':
      - /url: /evidence#ref-nice-cg178
    - 'link "Source: NICE CG155"':
      - /url: /evidence#ref-nice-cg155
  - heading "Why new options are being studied" [level=2]
  - text: Open question
  - paragraph:
    - text: Psychological therapy is the recommended first step, but it does not prevent psychosis in everyone.
    - 'link "Source: Stafford et al. 2013"':
      - /url: /evidence#ref-stafford-2013
    - text: Antipsychotics are not recommended for people at clinical high risk, most of whom will not develop psychosis.
    - 'link "Source: NICE CG178"':
      - /url: /evidence#ref-nice-cg178
    - text: Researchers are therefore looking for treatments that could be both helpful and well tolerated.
  - paragraph:
    - text: No intervention has been shown to be better than the others at preventing psychosis.
    - 'link "Source: Davies et al. 2018"':
      - /url: /evidence#ref-davies-2018
    - text: Cannabidiol (CBD) is one candidate. Whether it, or any medicine, can safely reduce symptoms, improve functioning or lower the risk of psychosis in this group is not yet known.
    - link "What the science shows so far":
      - /url: /science
    - text: .
  - heading "If you are worried about yourself or someone else" [level=3]
  - paragraph:
    - text: Talk to your GP or a mental health professional. In the UK, NHS early intervention in psychosis services can assess young people who may be at risk. For urgent help, see
    - link "urgent help by country":
      - /url: /faq#urgent-help
    - text: .
