- main:
  - paragraph: Programme updates
  - heading "Programme updates" [level=1]
  - paragraph:
    - text: Dated events that have happened. Planned steps are listed separately on the
    - link "study page":
      - /url: /study#milestones
    - text: .
  - heading "Timeline" [level=2]
  - list:
    - listitem:
      - time: 30 March 2026
      - text: · Operational
      - heading "Phase 1 analysis outputs delivered" [level=3]
      - paragraph: The statistical and pharmacokinetic analysis outputs for the Phase 1 study were delivered.
    - listitem:
      - time: 11 March 2026
      - text: · Clinical
      - heading "Phase 1 database locked" [level=3]
      - paragraph: The Phase 1 study database was locked so that the final analysis could begin.
    - listitem:
      - time: 10 December 2025
      - text: · Clinical
      - heading "Phase 1 study completed" [level=3]
      - paragraph: The last study activity took place in the Phase 1 study of NWPT-SM32300 in 14 healthy volunteers.
    - listitem:
      - time: 27 August 2025
      - text: · Clinical
      - heading "Phase 1 study started" [level=3]
      - paragraph: The first healthy volunteers gave consent to take part in the UK Phase 1 study (NCT07186283), which compared single doses of NWPT-SM32300 with the licensed cannabidiol medicine Epidyolex.
  - complementary:
    - heading "About these updates" [level=3]
    - paragraph: Each entry records a completed event and is supported by a programme record.
    - paragraph: Updates are written for the public, patients and clinicians. They are not investment communications.
    - paragraph:
      - link "Corrections log":
        - /url: /newsroom#corrections
  - region "Following the research":
    - heading "Following the research" [level=2]
    - paragraph:
      - text: Anyone can follow the programme here, read the
      - link "evidence behind it":
        - /url: /evidence
      - text: and send questions or corrections through the
      - link "contact page":
        - /url: /contact
      - text: . Questions and corrections help us explain the research clearly.
    - paragraph: Following the programme, or taking part in discussion about it, creates no right to invest and no say in clinical decisions.
