  - region "How we report progress":
    - heading "How we report progress" [level=2]
    - paragraph: "Each programme report is written to answer four questions:"
    - list:
      - listitem:
        - strong: What changed?
        - text: Events since the last report, with dates.
      - listitem:
        - strong: What supports it?
        - text: The record or source for each statement.
      - listitem:
        - strong: What remains unresolved?
        - text: Open questions, delays and risks.
      - listitem:
        - strong: What happens next?
        - text: The next steps, marked as planned.
    - paragraph:
      - text: Individual events are listed on the
      - link "updates page":
        - /url: /updates
      - text: as they happen.
  - region "Corrections log":
    - heading "Corrections log" [level=2]
    - paragraph: No corrections have been made since publication.
    - paragraph: When we correct a substantive error in published content, we record the date, what was wrong and what we changed. Typographical fixes are not listed.
