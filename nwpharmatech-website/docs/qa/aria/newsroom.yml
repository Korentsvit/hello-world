- main:
  - paragraph: About
  - heading "Newsroom" [level=1]
  - paragraph: Key facts for journalists and others writing about the programme, how we report progress, and how we correct mistakes.
  - region "Press kit":
    - heading "Press kit" [level=2]
    - heading "About us" [level=3]
    - paragraph: NWPharmaTech Ltd is a UK company developing NWPT-SM32300, an investigational oral cannabidiol medicine, for people at clinical high risk of psychosis. A Phase 1 study in healthy volunteers (NCT07186283) was completed on 10 December 2025; a Phase 2B study is planned. NWPT-SM32300 is not approved for any use and its effectiveness is unproven.
    - table "Fact sheet (as of 23 September 2026)":
      - caption: Fact sheet (as of 23 September 2026)
      - rowgroup:
        - row "Company NWPharmaTech Ltd, company number 13572461, England and Wales":
          - rowheader "Company"
          - cell "NWPharmaTech Ltd, company number 13572461, England and Wales"
        - 'row "Investigational medicine NWPT-SM32300: 300 mg oral softgel capsule of highly purified cannabidiol"':
          - rowheader "Investigational medicine"
          - 'cell "NWPT-SM32300: 300 mg oral softgel capsule of highly purified cannabidiol"'
        - row "Regulatory status investigational; not approved by any medicines regulator for any use":
          - rowheader "Regulatory status"
          - cell "investigational; not approved by any medicines regulator for any use"
        - row "Completed study Phase 1, 14 healthy adult volunteers aged 18 to 55; NCT07186283, ISRCTN25163383; completed 10 December 2025":
          - rowheader "Completed study"
          - cell "Phase 1, 14 healthy adult volunteers aged 18 to 55; NCT07186283, ISRCTN25163383; completed 10 December 2025"
        - 'row "Planned study Phase 2B in people at clinical high risk of psychosis: Planned. Not recruiting."':
          - rowheader "Planned study"
          - 'cell "Phase 2B in people at clinical high risk of psychosis: Planned. Not recruiting."'
        - row "Media contact +44 20 3693 3791 (head office)":
