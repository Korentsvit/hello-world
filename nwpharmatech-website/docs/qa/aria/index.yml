- main:
  - paragraph: Research programme · Clinical high risk of psychosis
  - heading "Careful research for young people at clinical high risk of psychosis" [level=1]
  - paragraph: We are developing NWPT-SM32300, an investigational oral cannabidiol medicine, and planning a Phase 2B study. Whether it helps is not yet known. Finding out is the purpose of the research.
  - link "Read the programme brief":
    - /url: "#programme-brief"
  - link "For young people and families":
    - /url: families.html
  - region "The programme in 90 seconds":
    - heading "The programme in 90 seconds" [level=2]
    - list:
      - listitem:
        - paragraph: 1 · The clinical need
        - heading "Young people at risk, with no licensed medicine" [level=3]
        - paragraph:
          - text: Some young people who seek help meet criteria for clinical high risk of psychosis. In pooled studies, about one in four developed psychosis within three years.
          - 'link "Source: Source: Salazar de Pablo et al. 2021"':
            - /url: evidence.html#ref-salazar-2021
        - paragraph:
          - link "Clinical need":
            - /url: clinical-need.html
      - listitem:
        - paragraph: 2 · The investigational candidate
        - heading "NWPT-SM32300" [level=3]
        - paragraph: A 300 mg oral softgel capsule of highly purified cannabidiol, in a self-emulsifying (micellar) lipid formulation. It is investigational; not approved by any medicines regulator for any use.
        - paragraph:
          - link "Science and formulation":
            - /url: science.html
      - listitem:
        - paragraph: 3 · The planned study
        - heading "A Phase 2B study in clinical high risk" [level=3]
        - paragraph: Designed to evaluate dose response, symptoms, safety and tolerability in people at clinical high risk of psychosis.
        - paragraph:
          - 'link "The study: progress and evidence"':
            - /url: study.html
      - listitem:
        - paragraph: 4 · Current status
        - heading "Phase 1 completed; Phase 2B planned" [level=3]
        - paragraph: The Phase 1 study in healthy volunteers was completed in December 2025. The Phase 2B study is not recruiting. Protocol being finalised.
        - paragraph:
          - link "Milestones and sources":
            - /url: study.html#milestones
  - region "The programme on one page":
    - paragraph: Programme brief
    - heading "The programme on one page" [level=2]
    - paragraph: NWPharmaTech presents our research programme for people at clinical high risk of psychosis, explaining the clinical need, the science and the people behind it.
    - paragraph:
      - text: The programme centres on
      - strong: NWPT-SM32300
      - text: ", an investigational oral cannabidiol formulation, and a planned"
      - strong: Phase 2B study
      - text: evaluating dose response, symptoms, safety and tolerability.
    - paragraph: Alongside the clinical programme, we are developing a financing route through which eligible investors could take part through a dedicated programme vehicle, potentially using permissioned tokens. Clinical decisions remain independent of financing, and the treatment's effectiveness is unproven.
    - link "Download the brief (PDF, 2 pages)":
      - /url: downloads/nwpharmatech-programme-brief.pdf
    - link "Study progress and evidence":
      - /url: study.html
    - paragraph: Brief updated 23 September 2026.
  - region "Latest programme update":
    - heading "Latest programme update" [level=2]
    - article:
      - paragraph:
        - time: 30 March 2026
        - text: · Operational
      - heading "Phase 1 analysis outputs delivered" [level=3]
      - paragraph: The statistical and pharmacokinetic analysis outputs for the Phase 1 study were delivered. A results summary will be published after review.
      - paragraph:
        - link "All programme updates":
          - /url: updates.html
    - complementary:
      - heading "Independent clinical decisions" [level=3]
      - paragraph: Study design, participant safety, analysis and publication are decided by the clinical and scientific leadership, subject to regulators and research ethics committees. Funders and investors have no say in them.
      - paragraph:
        - link "People and governance":
          - /url: people.html
  - region "How we label what is known":
    - heading "How we label what is known" [level=2]
    - paragraph: Each section of the site carries one label, so you can see how firm the ground is before reading the detail.
    - text: Established
    - paragraph: Consistent evidence, systematic reviews, regulatory decisions or clinical guidelines.
    - text: Emerging evidence
    - paragraph: Small, short or early studies. Informative, not confirmed.
    - text: Open question
    - paragraph: Not yet known; what research aims to answer.
    - text: Programme information
    - paragraph: Facts about NWPT-SM32300 and our own studies. Not an assessment of evidence strength.
  - region "Funding and financing":
    - heading "Funding and financing" [level=2]
    - paragraph: We are developing platform-integrated programme financing through a dedicated programme vehicle, potentially with permissioned tokens issued at closing where feasible. No investment is being accepted, and financing has no influence on clinical decisions.
    - paragraph:
      - link "How funding works and how progress is reported":
        - /url: financing.html
