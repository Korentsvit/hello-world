<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#005EB8">
  <link rel="icon" href="{{block:brand:icon}}" type="image/svg+xml">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">{{ui:skip}}</a>
  {{env_banner}}
  <aside class="notice-bar" aria-label="{{ui:notice_region}}">
    <div class="container">
      {{ui:notice}}
    </div>
  </aside>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="{{ui:brand_home}}">{{block:brand:header}}</a>
      <nav class="site-nav" aria-label="{{ui:nav_main}}">
        <ul>
          {{nav}}
        </ul>
      </nav>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav">
        <span class="nav-toggle-bar" aria-hidden="true"></span>
        <span class="nav-toggle-label">{{ui:menu}}</span>
      </button>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="{{ui:nav_mobile}}" hidden>
      <div class="container">
        {{mobile_nav}}
      </div>
    </nav>
  </header>
  {{block:subnav}}

  <main id="main" tabindex="-1">
